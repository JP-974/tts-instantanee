name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fichiers présents
        run: |
          for f in index.html style.css app.js README.md favicon.png vendor/pdf.js vendor/pdf.worker.js .github/workflows/ci.yml; do
            test -f "$f" || { echo "Fichier manquant: $f"; exit 1; }
          done

      - name: Syntaxe JavaScript
        run: node --check app.js

      - name: HTML analysable
        run: python3 -c "from html.parser import HTMLParser; HTMLParser().feed(open('index.html', encoding='utf-8').read())"

      - name: Cohérence HTML ↔ JS
        run: |
          for id in $(grep -o "getElementById('[^']*')" app.js | sed "s/getElementById('//;s/')//"); do
            grep -q "id=\"$id\"" index.html || { echo "Identifiant absent de index.html: $id"; exit 1; }
          done
          grep -q 'src="app.js"' index.html || { echo "app.js non référencé"; exit 1; }
          grep -q 'href="style.css"' index.html || { echo "style.css non référencé"; exit 1; }
          grep -q 'rel="icon"' index.html || { echo "favicon non référencé"; exit 1; }
          grep -q 'src="favicon.png"' index.html || { echo "favicon.png non utilisé"; exit 1; }
